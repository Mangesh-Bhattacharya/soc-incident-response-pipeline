name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monthly even with zero commits -- catches drift from the outside
    # world (an upstream API changing shape, a floating base image tag
    # moving) that no diff in this repo would ever trigger a test run for.
    - cron: "0 7 1 * *"
  workflow_dispatch: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: Validate n8n workflow JSON
        run: python -c "import json; json.load(open('n8n/soc_triage_workflow.json', encoding='utf-8'))"

      - name: Smoke-test CLI (dry run, no API keys required for the low-score path)
        run: |
          echo '{"rule_name":"CI Smoke Test","host":"ci-runner","user":"ci"}' > /tmp/ci_alert.json
          python cli.py --alert /tmp/ci_alert.json --json | grep -q '"severity": "INFO"'

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create empty .env (demo mode -- no real keys needed to prove the stack boots)
        run: cp .env.example .env

      - name: Build and start the stack
        run: docker compose -p soc-pipeline up --build -d

      - name: Wait for both containers to report healthy
        run: |
          for i in $(seq 1 30); do
            api_status=$(docker inspect -f '{{.State.Health.Status}}' soc-pipeline-api-1 2>/dev/null || echo "starting")
            dash_status=$(docker inspect -f '{{.State.Health.Status}}' soc-pipeline-dashboard-1 2>/dev/null || echo "starting")
            echo "api=$api_status dashboard=$dash_status"
            if [ "$api_status" = "healthy" ] && [ "$dash_status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Containers never became healthy" >&2
          docker compose -p soc-pipeline logs
          exit 1

      - name: Hit the dashboard and the proxied API through the published port
        run: |
          curl -sf http://localhost:8080/ | grep -qi "SOC Triage Console"
          curl -sf http://localhost:8080/api/health | grep -Eq '"status":\s*"ok"'

      - name: Confirm the API container publishes no host port
        run: |
          if docker port soc-pipeline-api-1 2>/dev/null | grep -q .; then
            echo "API container should not publish any port to the host" >&2
            exit 1
          fi

      - name: Show logs on failure
        if: failure()
        run: docker compose -p soc-pipeline logs

      - name: Tear down
        if: always()
        run: docker compose -p soc-pipeline down -v

  notify-on-scheduled-failure:
    # Only the monthly cron run gets here for this -- a push/PR failure is
    # already visible to whoever opened it. A scheduled run has nobody
    # watching by default, so a silent failure is worse than a noisy one.
    if: always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure')
    needs: [lint, test, dashboard, docker]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update a tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create scheduled-ci-failure --repo "$REPO" --color d73a4a \
            --description "Auto-filed by the monthly scheduled CI run" 2>/dev/null || true
          existing=$(gh issue list --repo "$REPO" --label scheduled-ci-failure --state open --json number --jq '.[0].number')
          body="The monthly scheduled CI run failed with nothing pushed to trigger it -- something outside this repo (an upstream package, a base image, an API) likely changed underneath it.

          Run: $RUN_URL"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "Scheduled CI failed: $(date -u +%Y-%m-%d)" \
              --label scheduled-ci-failure --body "$body"
          fi
