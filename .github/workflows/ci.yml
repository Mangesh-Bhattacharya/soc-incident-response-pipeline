name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: Validate n8n workflow JSON
        run: python -c "import json; json.load(open('n8n/soc_triage_workflow.json', encoding='utf-8'))"

      - name: Smoke-test CLI (dry run, no API keys required for the low-score path)
        run: |
          echo '{"rule_name":"CI Smoke Test","host":"ci-runner","user":"ci"}' > /tmp/ci_alert.json
          python cli.py --alert /tmp/ci_alert.json --json | grep -q '"severity": "INFO"'

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build
