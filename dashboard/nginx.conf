server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Baseline hardening headers -- this is a local demo console, not a
    # public multi-tenant app, but there's no reason to skip the free wins.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Same-origin proxy to the API container. The dashboard's JS calls
    # /api/... as a relative path (see dashboard/src/api.ts), so the browser
    # never talks to the "api" service directly -- it isn't even reachable
    # from outside the compose network. No CORS configuration needed.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # SPA fallback: any other path serves index.html so client-side routing
    # (if this ever grows one) doesn't 404 on a hard refresh.
    location / {
        try_files $uri /index.html;
    }
}
